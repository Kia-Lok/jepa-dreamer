[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "smacdreamer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "cloudpickle",
  "gymnasium",
  "hydra-core",
  "numpy",
  "omegaconf",
  "ruamel.yaml",
  "rtree",
  "scikit-learn",
  "tensorboard",
  "tensordict",
  "torchrl",
  "wandb",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
