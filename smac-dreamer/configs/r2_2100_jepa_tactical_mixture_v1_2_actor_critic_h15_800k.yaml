maps:
  train: configs/maps/r2_2100/configs/train
  validation: configs/maps/r2_2100/configs/validation
  blind_iid: configs/maps/r2_2100/configs/blind_iid
  blind_compositional: configs/maps/r2_2100/configs/blind_compositional
sampling_mode: shuffled_round_robin
observation:
  mode: structured
action_masking: true
mask_threshold: 0.05
world_model:
  backend: jepa
  jepa:
    checkpoint: checkpoints/jepa/model_exp40.pt
    strict_checkpoint: true
    freeze_core: true
    presence_threshold: 0.5
    feature_dim: null
    pooling: slot_ally_enemy_global
    latent_normalization: from_checkpoint
reward:
  name: dense_v3
  params: {}
device: cuda:0
amp_dtype: bfloat16
seed: 0
gamma: 0.997
steps: 2000000
env_num: 8
max_episode_steps: 200
batch_size: 16
batch_length: 64
units: 256
deter: 2048
imag_horizon: 15
validation:
  every: 200000
  run_at_start: true
  seeds:
  - 0
  - 1
  - 2
buffer:
  max_size: 500000
  storage_device: cpu
  storage_backend: memmap
  scratch_dir: replay_tactical_v12_actor_critic_h15_800k
env_lifecycle:
  max_episodes_per_worker: 25
  shutdown_timeout_seconds: 5
  log_worker_memory: true
system_log_every: 10000
wandb:
  project: smac-dreamer-jepa
  entity: null
  mode: online
  tags:
  - r2_2100
  - smaclite
  - frozen_jepa
  - exp40
  - dense_v3
  - permissive_imagmask
  - eval_100k
  run_name: tactical_v12_actor_critic_h15_800k
logdir: logs/r2dreamer/r2_2100_jepa
checkpoint_every_minutes: 15.0
adaptive_priority:
  enabled: false
  map:
    enabled: false
  sequence:
    enabled: false
tactical_mixture:
  enabled: true
  num_tactics: 2
  embedding_dim: 16
  hidden_dim: 128
  tactic_pg_scale: 1.0
  tactic_entropy_scale: 0.0
  balance_loss_scale: 0.0
  effect_loss_scale: 0.1
  effect_target: 0.002
  max_effect_states: 256
  duration: 1
  collapse_loss_scale: 0.1
  max_usage_target: 0.75
  min_effective_tactics: 1.6
  symmetry_break_std: 0.01
  eval_confidence_threshold: 0.7
  freeze_base_actor: true
  freeze_feature_adapter: true
  residual_guard_scale: 0.05
  max_residual_to_base: 0.25
  max_abs_residual_logit: 2.0
