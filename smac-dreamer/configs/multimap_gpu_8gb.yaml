
# Multimap R2-Dreamer × SMAClite training config — WINDOWS GPU, 8 GB VRAM (RTX 3070).
#
# Tuned twin of configs/multimap_gpu.yaml for a single 8 GB consumer GPU (the A40
# config assumes 46 GB and will OOM here). Same entry point:
#   python scripts/train_r2dreamer_smaclite_multimap.py --config configs/multimap_gpu_8gb.yaml
#
# Keeps the FULL ~18.85M-param model (units=256, deter=2048, imag_horizon=15) but
# shrinks the memory-driving knobs vs the A40 config:
#   * batch_size  16 -> 4     (dominant activation-memory term)
#   * batch_length 64 -> 32   (RSSM unroll length; halves sequence activations)
#   * env_num      4 -> 1      (Windows: single-process collection is most reliable)
# Raise batch_size first if `nvidia-smi` shows spare VRAM; drop it to 2 if you OOM.

# ---- Map discovery + split ------------------------------------------------
maps_folder: configs/maps/easy500     # provide this folder (scanned for *.json maps)
split:
  mode: ratio
  train_ratio: 0.8
  seed: 0

sampling_mode: shuffled_round_robin

# Optional manual padding cap (else auto from TRAIN-max). Must cover every map.
# padding:
#   max_agents: 8
#   max_enemies: 9
#   max_actions: 15
#   max_obs_size: 136

# ---- Reward --------------------------------------------------------------
reward:
  name: dense_v3
  params:
    w_win: 1.0
    w_loss: 1.0
    w_hp: 0.1
    w_ally: 0.1
    nonpotential:
      positioning_weight: 0.0

# ---- Run / model knobs (full model; batches sized for 8 GB) ----------------
device: cuda:0                        # the RTX 3070; propagated to every device field
seed: 0
gamma: 0.997                          # MUST equal the agent discount (1 - 1/horizon)
steps: 1000000                        # 1M env steps (override with --steps if needed)
env_num: 1                            # Windows: keep 1 (spawn ParallelEnv is flaky >1)
max_episode_steps: 200

batch_size: 4                         # 8 GB-safe; raise toward 16 only if VRAM allows
batch_length: 32                      # shorter RSSM unroll than the A40 config (64)
units: 256                            # FULL size12M width (unchanged)
deter: 2048                           # FULL size12M recurrent state (unchanged)
imag_horizon: 15                      # FULL imagination horizon (unchanged)

# ---- Evaluation on held-out maps ------------------------------------------
eval:
  every: 20000
  episodes_per_map: 8

# ---- Logging --------------------------------------------------------------
wandb:
  project: smac-r2dreamer             # set null to fall back to TensorBoard/JSONL
  run_name: easy500_windows_1m        # your requested run name
logdir: logs/r2dreamer/multimap_gpu_8gb
checkpoint_every_minutes: 10.0
