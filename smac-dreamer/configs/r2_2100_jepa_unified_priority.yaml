maps:
  train: configs/maps/r2_2100/configs/train
  validation: configs/maps/r2_2100/configs/validation
  blind_iid: configs/maps/r2_2100/configs/blind_iid
  blind_compositional: configs/maps/r2_2100/configs/blind_compositional
sampling_mode: adaptive_priority
observation:
  mode: structured
action_masking: true
mask_threshold: 0.05
world_model:
  backend: jepa
  jepa:
    checkpoint: checkpoints/jepa/model_exp40.pt
    strict_checkpoint: true
    freeze_core: true
    presence_threshold: 0.5
    feature_dim: null
    pooling: slot_ally_enemy_global
    latent_normalization: from_checkpoint
reward:
  name: dense_v3
  params: {}
device: cuda:0
amp_dtype: bfloat16
seed: 0
gamma: 0.997
steps: 2000000
env_num: 8
max_episode_steps: 200
batch_size: 16
batch_length: 64
units: 256
deter: 2048
imag_horizon: 5
validation:
  every: 200000
  run_at_start: false
  seeds:
  - 0
  - 1
  - 2
buffer:
  max_size: 500000
  storage_device: cpu
  storage_backend: memmap
  scratch_dir: replay
env_lifecycle:
  max_episodes_per_worker: 25
  shutdown_timeout_seconds: 5
  log_worker_memory: true
system_log_every: 10000
wandb:
  project: smac-dreamer-jepa
  entity: null
  mode: online
  tags:
  - r2_2100
  - smaclite
  - frozen_jepa
  - exp40
  - dense_v3
  - permissive_imagmask
  - eval_100k
  run_name: exp40_jepa_dense_v3_perm_imagmask_200k_resume_2m
logdir: logs/r2dreamer/r2_2100_jepa
checkpoint_every_minutes: 15.0
adaptive_priority:
  enabled: true
  map:
    enabled: true
    error_ema_decay: 0.99
    uniform_floor: 0.1
    staleness_mix: 0.2
    update_every_feedbacks: 32
    minimum_feedback: 4
    initial_error: 1.0
  sequence:
    enabled: true
    candidate_multiplier: 4
    alpha: 0.6
    beta_start: 0.4
    beta_end: 1.0
    beta_anneal_env_steps: 2000000
    eps: 1.0e-06
    min_priority: 0.001
    max_priority: 100.0
    cache_max_entries: 500000
    seed: 0
