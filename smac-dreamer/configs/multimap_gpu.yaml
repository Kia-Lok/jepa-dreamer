# Multimap R2-Dreamer × SMAClite training config — CLOUD GPU (A40, CUDA).
#
# GPU twin of configs/multimap.yaml. Consumed by the SAME entry point:
#   python scripts/train_r2dreamer_smaclite_multimap.py --config configs/multimap_gpu.yaml
#
# Differences vs the CPU debug config: device=cuda:0, larger model + batches, more
# parallel env workers, and a longer run. All model/batch knobs are tunable starting
# points — the A40 has 46 GB, so there is plenty of head-room to raise them.

# ---- Map discovery + split ------------------------------------------------
maps_folder: configs\maps\r2_smaclite_650_configs\configs\train     # provide this folder (scanned for *.json maps)
split:
  mode: ratio
  train_ratio: 0.8
  seed: 0

sampling_mode: shuffled_round_robin

# ---- Observation representation -------------------------------------------
observation:
  mode: structured                      # "structured" (canonical per-entity) | "flat" (legacy)

# Optional manual padding cap (else auto from TRAIN-max). Must cover every map.
# padding:
#   max_agents: 8
#   max_enemies: 9
#   max_actions: 15
#   max_obs_size: 136

# ---- Reward --------------------------------------------------------------
reward:
  name: dense_v3
  params:
    w_win: 1.0
    w_loss: 1.0
    w_hp: 0.1
    w_ally: 0.1
    nonpotential:
      positioning_weight: 0.0

# ---- Run / model knobs (GPU production starting points) -------------------
device: cuda:0                        # the A40; propagated to every device field
seed: 0
gamma: 0.997                          # MUST equal the agent discount (1 - 1/horizon)
steps: 200000                         # raise for a full run; eval cadence below
env_num: 4                            # Linux: safe to parallelise; raise if CPU allows
max_episode_steps: 200

batch_size: 16
batch_length: 64
units: 256                            # size12M width
deter: 2048                           # size12M recurrent state
imag_horizon: 15

# ---- Evaluation on held-out maps ------------------------------------------
eval:
  every: 20000
  episodes_per_map: 8         # in-training periodic monitor (parallel-worker pass)
  fixed_seeds: [0, 1, 2]      # standalone evaluate_multimap.py: every held-out map × each seed

# ---- Logging --------------------------------------------------------------
wandb:
  project: smac-r2dreamer             # set null to fall back to TensorBoard/JSONL
  run_name: 2M_650experimental                      # auto: <folder>-<reward>-<resolved-params-hash>
logdir: logs/r2dreamer/multimap_gpu   # lives on the notebook's persistent volume
checkpoint_every_minutes: 10.0
