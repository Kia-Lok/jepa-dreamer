# Reward ablation — Baseline B: existing dense_v3 shaping (UNCHANGED).
#
# Same dense_v3 reward + params as configs/multimap_gpu.yaml; only logdir differs so it sits
# beside the other ablation runs. Run:
#   python scripts/train_r2dreamer_smaclite_multimap.py --config configs/ablation/B_dense_v3.yaml
#
# Primary model-selection metric: held-out battle win rate, then original env return.

maps_folder: configs/maps/easy500
split:
  mode: ratio
  train_ratio: 0.8
  seed: 0

sampling_mode: shuffled_round_robin

observation:
  mode: structured

# ---- Reward: existing dense_v3 (potential HP + ally-survival + terminal), unchanged ----
reward:
  name: dense_v3
  params:
    w_win: 1.0
    w_loss: 1.0
    w_hp: 0.1
    w_ally: 0.1
    nonpotential:
      positioning_weight: 0.0

# ---- Run / model knobs (must match the other ablation presets) ----
device: cuda:0
seed: 0
gamma: 0.997
steps: 200000
env_num: 4
max_episode_steps: 200

batch_size: 16
batch_length: 64
units: 256
deter: 2048
imag_horizon: 15

eval:
  every: 20000
  episodes_per_map: 8
  fixed_seeds: [0, 1, 2]

wandb:
  project: smac-r2dreamer
  run_name: null
logdir: logs/r2dreamer/ablation/B_dense_v3
checkpoint_every_minutes: 10.0
